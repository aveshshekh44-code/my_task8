<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Mart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">
            Laundry Mart
        </div>

        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>

        <div class="username">
            Hello, User
        </div>
    </header>

    <!-- Hero Section -->
    <main class="hero">

        <div class="hero-content">
            <h1>Fresh Clothes,<br>Fresh Life!</h1>

            <p>
                Professional laundry and dry cleaning services
                at your doorstep. We wash, clean and deliver
                your clothes with care.
            </p>

            <button class="cta-button">
                Book a Laundry Service
            </button>
        </div>

        <div class="hero-image">
            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7ctaVI-QOXM1_WKXjUhk7Dzci52uOpn1kmWkKII7pcA&s=10"
                alt="Laundry Service">
        </div>

    </main>

</body>
</html>
